name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 小熊秀雄全集-12 詩集（11）文壇諷刺詩篇 "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: oguma-bundan-fushi-shihen-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
